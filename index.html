<!DOCTYPE html><html><head><base href="https://websim.ai/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>API's Profile Page with ASCII Stream</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background-color: #1a1a1a;
    color: #fff;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    border-bottom: 1px solid #333;
}
.profile-info {
    display: flex;
    align-items: center;
}
.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-right: 20px;
    background-size: cover;
    background-position: center;
}
.stats {
    display: flex;
    gap: 20px;
}
.stat {
    text-align: center;
}
.stat-value {
    font-size: 24px;
    font-weight: bold;
}
.stat-label {
    font-size: 14px;
    color: #888;
}
main {
    margin-top: 20px;
}
h2 {
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
}
.project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    list-style-type: none;
    padding: 0;
}
.project-item {
    background-color: #2c2c2c;
    border-radius: 5px;
    overflow: hidden;
    transition: transform 0.3s ease;
}
.project-item:hover {
    transform: translateY(-5px);
}
.project-image {
    width: 100%;
    height: 150px;
    background-size: cover;
    background-position: center;
}
.project-details {
    padding: 15px;
}
.project-title {
    font-size: 16px;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.project-description {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.project-stats {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #aaa;
}
.follow-list {
    list-style-type: none;
    padding: 0;
}
.follow-item {
    background-color: #2c2c2c;
    margin-bottom: 10px;
    padding: 15px;
    border-radius: 5px;
}
.follow-username {
    font-size: 18px;
    margin-bottom: 5px;
}
.follow-bio {
    font-size: 14px;
    color: #888;
}
.stream-container {
    background-color: #000;
    aspect-ratio: 16 / 9;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    margin-bottom: 20px;
    cursor: pointer;
    position: relative;
}
.stream-container.streaming {
    font-size: 4px;
    line-height: 1;
    white-space: pre;
    overflow: hidden;
    font-family: monospace;
    padding: 10px;
}
.audio-visualizer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 25px;
    font-family: monospace;
    font-size: 4px;
    line-height: 1;
    white-space: pre;
    background-color: rgba(0, 0, 0, 0.5);
    padding: 5px;
    overflow: hidden;
}
#controls {
    display: flex;
    margin-top: 10px;
    justify-content: center;
    gap: 10px;
}
#controls button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    transition: background-color 0.3s;
}
#controls button:hover {
    background-color: #45a049;
}
#controls button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}
#image-controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
}
#image-controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
#image-controls input {
    width: 100%;
}
.tab-container {
    margin-top: 20px;
}
.tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}
.tab-button {
    padding: 10px 20px;
    background-color: #2c2c2c;
    border: none;
    color: #fff;
    cursor: pointer;
    border-radius: 5px;
}
.tab-button.active {
    background-color: #4CAF50;
}
.tab-content {
    display: none;
}
.tab-content.active {
    display: block;
}
.load-more {
    display: block;
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
}
.load-more:disabled {
    background-color: #888;
    cursor: not-allowed;
}
</style></head><body>
<div class="container">
    <header>
        <div class="profile-info">
            <div id="avatar" class="avatar"></div>
            <h1 id="username">API</h1>
        </div>
        <div class="stats">
            <div class="stat">
                <div id="projects-count" class="stat-value">0</div>
                <div class="stat-label">Projects</div>
            </div>
            <div class="stat">
                <div id="followers-count" class="stat-value">0</div>
                <div class="stat-label">Followers</div>
            </div>
            <div class="stat">
                <div id="following-count" class="stat-value">0</div>
                <div class="stat-label">Following</div>
            </div>
        </div>
    </header>
    
    <div id="streaming-controls" style="display: none;">
        <div id="stream-container" class="stream-container">
            Click to Start Streaming
        </div>
        <div id="controls">
            <button id="start-btn">Start Sharing</button>
            <button id="stop-btn" disabled="">Stop Sharing</button>
            <div id="volume-control">
                <label for="volume">Master Volume:</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
            </div>
        </div>
        <div id="image-controls" style="display: none;">
    <label for="brightness">Brightness:
        <input type="range" id="brightness" min="0" max="2" step="0.1" value="1">
    </label>
    <label for="contrast">Contrast:
        <input type="range" id="contrast" min="0" max="2" step="0.1" value="1">
    </label>
    <label for="blur">Blur:
        <input type="range" id="blur" min="0" max="10" step="0.5" value="0">
    </label>
</div>
    </div>
    
    <main>
        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="projects">Projects</button>
                <button class="tab-button" data-tab="followers">Followers</button>
                <button class="tab-button" data-tab="following">Following</button>
            </div>
            <div id="projects" class="tab-content active">
                <h2>Projects</h2>
                <ul id="project-list" class="project-grid"></ul>
                <button id="load-more-projects" class="load-more">Load More</button>
            </div>
            <div id="followers" class="tab-content">
                <h2>Followers</h2>
                <ul id="followers-list" class="follow-list"></ul>
            </div>
            <div id="following" class="tab-content">
                <h2>Following</h2>
                <ul id="following-list" class="follow-list"></ul>
            </div>
        </div>
    </main>
</div>
