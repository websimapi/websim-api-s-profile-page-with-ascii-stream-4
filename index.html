<html><head><base href="https://websim.ai/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>API's Profile Page with ASCII Stream</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background-color: #1a1a1a;
    color: #fff;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    border-bottom: 1px solid #333;
}
.profile-info {
    display: flex;
    align-items: center;
}
.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-right: 20px;
    background-size: cover;
    background-position: center;
}
.stats {
    display: flex;
    gap: 20px;
}
.stat {
    text-align: center;
}
.stat-value {
    font-size: 24px;
    font-weight: bold;
}
.stat-label {
    font-size: 14px;
    color: #888;
}
main {
    margin-top: 20px;
}
h2 {
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
}
.project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    list-style-type: none;
    padding: 0;
}
.project-item {
    background-color: #2c2c2c;
    border-radius: 5px;
    overflow: hidden;
    transition: transform 0.3s ease;
}
.project-item:hover {
    transform: translateY(-5px);
}
.project-image {
    width: 100%;
    height: 150px;
    background-size: cover;
    background-position: center;
}
.project-details {
    padding: 15px;
}
.project-title {
    font-size: 16px;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.project-description {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.project-stats {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #aaa;
}
.follow-list {
    list-style-type: none;
    padding: 0;
}
.follow-item {
    background-color: #2c2c2c;
    margin-bottom: 10px;
    padding: 15px;
    border-radius: 5px;
}
.follow-username {
    font-size: 18px;
    margin-bottom: 5px;
}
.follow-bio {
    font-size: 14px;
    color: #888;
}
.stream-container {
    background-color: #000;
    width: 100%;
    aspect-ratio: 16 / 9;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    margin-bottom: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}
.stream-container.streaming {
    font-size: 8px;
    line-height: 1;
    white-space: pre;
    font-family: monospace;
    padding: 20px;
}
.audio-visualizer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    font-family: monospace;
    font-size: 8px;
    line-height: 1;
    white-space: pre;
    background-color: rgba(0, 0, 0, 0.5);
    padding: 10px;
    overflow: hidden;
}
#controls {
    display: flex;
    margin-top: 10px;
    justify-content: center;
    gap: 10px;
}
#controls button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    transition: background-color 0.3s;
}
#controls button:hover {
    background-color: #45a049;
}
#controls button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}
#image-controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
}
#image-controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
#image-controls input {
    width: 100%;
}
.tab-container {
    margin-top: 20px;
}
.tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}
.tab-button {
    padding: 10px 20px;
    background-color: #2c2c2c;
    border: none;
    color: #fff;
    cursor: pointer;
    border-radius: 5px;
}
.tab-button.active {
    background-color: #4CAF50;
}
.tab-content {
    display: none;
}
.tab-content.active {
    display: block;
}
.load-more {
    display: block;
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
}
.load-more:disabled {
    background-color: #888;
    cursor: not-allowed;
}
#streaming-content {
    display: flex;
    flex-direction: column;
    align-items: stretch;
}
#chat-container {
    margin-top: 10px;
    height: 200px;
    display: flex;
    flex-direction: column;
}
#chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    font-size: 14px;
}
#chat-input {
    width: calc(100% - 80px);
    padding: 5px;
}
#chat-send {
    width: 80px;
    padding: 5px;
}
#viewers-count {
    margin-top: 10px;
    text-align: center;
}
</style></head><body>

    <header>
        <div class="profile-info">
            <div id="avatar" class="avatar"></div>
            <h1 id="username">API</h1>
        </div>
