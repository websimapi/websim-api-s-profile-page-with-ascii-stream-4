<html><head><base href="https://websim.ai/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>API's Profile Page with ASCII Stream</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background-color: #1a1a1a;
    color: #fff;
}
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    border-bottom: 1px solid #333;
}
.profile-info {
    display: flex;
    align-items: center;
}
.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-right: 20px;
    background-size: cover;
    background-position: center;
}
.stats {
    display: flex;
    gap: 20px;
}
.stat {
    text-align: center;
}
.stat-value {
    font-size: 24px;
    font-weight: bold;
}
.stat-label {
    font-size: 14px;
    color: #888;
}
main {
    margin-top: 20px;
}
h2 {
    border-bottom: 1px solid #333;
    padding-bottom: 10px;
}
.project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    list-style-type: none;
    padding: 0;
}
.project-item {
    background-color: #2c2c2c;
    border-radius: 5px;
    overflow: hidden;
    transition: transform 0.3s ease;
}
.project-item:hover {
    transform: translateY(-5px);
}
.project-image {
    width: 100%;
    height: 150px;
    background-size: cover;
    background-position: center;
}
.project-details {
    padding: 15px;
}
.project-title {
    font-size: 16px;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.project-description {
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.project-stats {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #aaa;
}
.follow-list {
    list-style-type: none;
    padding: 0;
}
.follow-item {
    background-color: #2c2c2c;
    margin-bottom: 10px;
    padding: 15px;
    border-radius: 5px;
}
.follow-username {
    font-size: 18px;
    margin-bottom: 5px;
}
.follow-bio {
    font-size: 14px;
    color: #888;
}
.stream-container {
    background-color: #000;
    width: 100%;
    aspect-ratio: 16 / 9;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    margin-bottom: 10px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
}
.stream-container.streaming {
    font-size: 8px;
    line-height: 1;
    white-space: pre;
    font-family: monospace;
    padding: 20px;
}
.audio-visualizer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50px;
    font-family: monospace;
    font-size: 8px;
    line-height: 1;
    white-space: pre;
    background-color: rgba(0, 0, 0, 0.5);
    padding: 10px;
    overflow: hidden;
}
#controls {
    display: flex;
    margin-top: 10px;
    justify-content: center;
    gap: 10px;
}
#controls button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    transition: background-color 0.3s;
}
#controls button:hover {
    background-color: #45a049;
}
#controls button:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
}
#image-controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
}
#image-controls label {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
#image-controls input {
    width: 100%;
}
.tab-container {
    margin-top: 20px;
}
.tab-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}
.tab-button {
    padding: 10px 20px;
    background-color: #2c2c2c;
    border: none;
    color: #fff;
    cursor: pointer;
    border-radius: 5px;
}
.tab-button.active {
    background-color: #4CAF50;
}
.tab-content {
    display: none;
}
.tab-content.active {
    display: block;
}
.load-more {
    display: block;
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 20px;
}
.load-more:disabled {
    background-color: #888;
    cursor: not-allowed;
}
#streaming-content {
    display: flex;
    flex-direction: column;
    align-items: stretch;
}
#chat-container {
    margin-top: 10px;
    height: 200px;
    display: flex;
    flex-direction: column;
}
#chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    font-size: 14px;
}
#chat-input {
    width: calc(100% - 80px);
    padding: 5px;
}
#chat-send {
    width: 80px;
    padding: 5px;
}
#viewers-count {
    margin-top: 10px;
    text-align: center;
}
</style></head><body>
<div class="container">
    <header>
        <div class="profile-info">
            <div id="avatar" class="avatar"></div>
            <h1 id="username">API</h1>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="followers">0</div>
                <div class="stat-label">Followers</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="following">0</div>
                <div class="stat-label">Following</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="projects">0</div>
                <div class="stat-label">Projects</div>
            </div>
        </div>
    </header>

    <main>
        <div id="streaming-content">
            <div id="stream-container" class="stream-container">
                Click to start streaming
            </div>
            <div id="viewers-count">Viewers: 0</div>
            <div id="controls">
                <button id="start-stream">Start Stream</button>
                <button id="stop-stream" disabled>Stop Stream</button>
            </div>
            <div id="image-controls" style="display: none;">
                <label>
                    Master Volume:
                    <input type="range" id="master-volume" min="0" max="100" value="100">
                </label>
                <label>
                    Brightness:
                    <input type="range" id="brightness" min="0" max="200" value="100">
                </label>
                <label>
                    Contrast:
                    <input type="range" id="contrast" min="0" max="200" value="100">
                </label>
                <label>
                    Blur:
                    <input type="range" id="blur" min="0" max="20" value="0" step="0.1">
                </label>
            </div>
            <div id="chat-container">
                <div id="chat-messages"></div>
                <div>
                    <input type="text" id="chat-input" placeholder="Type your message...">
                    <button id="chat-send">Send</button>
                </div>
            </div>
        </div>

        <div class="tab-container">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="projects">Projects</button>
                <button class="tab-button" data-tab="followers">Followers</button>
                <button class="tab-button" data-tab="following">Following</button>
            </div>
            <div id="projects-tab" class="tab-content active">
                <h2>Projects</h2>
                <ul id="project-list" class="project-grid"></ul>
                <button id="load-more-projects" class="load-more">Load More</button>
            </div>
            <div id="followers-tab" class="tab-content">
                <h2>Followers</h2>
                <ul id="followers-list" class="follow-list"></ul>
                <button id="load-more-followers" class="load-more">Load More</button>
            </div>
            <div id="following-tab" class="tab-content">
                <h2>Following</h2>
                <ul id="following-list" class="follow-list"></ul>
                <button id="load-more-following" class="load-more">Load More</button>
            </div>
        </div>
    </main>
</div>

<script>
const apiURL = 'https://api.websim.ai';
const username = 'api';
let mediaRecorder;
let audioContext;
let audioSource;
let isStreaming = false;
let socket;
let viewers = 0;

document.addEventListener('DOMContentLoaded', () => {
    fetchUserData();
    setupEventListeners();
    setupWebSocket();
});

function fetchUserData() {
    fetch(`${apiURL}/users/${username}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('username').textContent = data.username;
            document.getElementById('avatar').style.backgroundImage = `url(${data.avatar})`;
            document.getElementById('followers').textContent = data.followers;
            document.getElementById('following').textContent = data.following;
            document.getElementById('projects').textContent = data.projects;
        })
        .catch(error => console.error('Error fetching user data:', error));
}

function setupEventListeners() {
    document.getElementById('start-stream').addEventListener('click', startStreaming);
    document.getElementById('stop-stream').addEventListener('click', stopStreaming);
    document.querySelectorAll('.tab-button').forEach(button => {
        button.addEventListener('click', () => switchTab(button.dataset.tab));
    });
    document.getElementById('load-more-projects').addEventListener('click', () => loadMore('projects'));
    document.getElementById('load-more-followers').addEventListener('click', () => loadMore('followers'));
    document.getElementById('load-more-following').addEventListener('click', () => loadMore('following'));
    document.getElementById('chat-send').addEventListener('click', sendChatMessage);
    document.getElementById('chat-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendChatMessage();
    });

    const imageControls = ['brightness', 'contrast', 'blur', 'master-volume'];
    imageControls.forEach(control => {
        document.getElementById(control).addEventListener('input', updateImageSettings);
    });
}

function setupWebSocket() {
    socket = new WebSocket('wss://websim.ai/ws');
    
    socket.onopen = () => {
        console.log('WebSocket connection established');
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'viewerCount') {
            viewers = data.count;
            updateViewerCount();
        } else if (data.type === 'chat') {
            addChatMessage(data.username, data.message);
        }
    };

    socket.onclose = () => {
        console.log('WebSocket connection closed');
    };
}

function startStreaming() {
    if (isStreaming) return;

    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            audioContext = new AudioContext();
            audioSource = audioContext.createMediaStreamSource(stream);

            const canvasEl = document.createElement('canvas');
            canvasEl.width = 640;
            canvasEl.height = 480;
            const ctx = canvasEl.getContext('2d');

            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();

            mediaRecorder.ondataavailable = (event) => {
                const reader = new FileReader();
                reader.onloadend = () => {
                    const base64data = reader.result;
                    socket.send(JSON.stringify({ type: 'stream', data: base64data }));
                };
                reader.readAsDataURL(event.data);
            };

            mediaRecorder.start(1000);

            function drawVideo() {
                if (isStreaming) {
                    ctx.drawImage(video, 0, 0, canvasEl.width, canvasEl.height);
                    const imageData = ctx.getImageData(0, 0, canvasEl.width, canvasEl.height);
                    const asciiFrame = convertToASCII(imageData);
                    document.getElementById('stream-container').innerHTML = asciiFrame;
                    requestAnimationFrame(drawVideo);
                }
            }

            drawVideo();

            isStreaming = true;
            document.getElementById('start-stream').disabled = true;
            document.getElementById('stop-stream').disabled = false;
            document.getElementById('image-controls').style.display = 'block';
            updateButtons();
        })
        .catch(error => console.error('Error accessing media devices:', error));
}

function stopStreaming() {
    if (!isStreaming) return;

    if (mediaRecorder) {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
    }

    if (audioContext) {
        audioContext.close();
    }

    isStreaming = false;
    document.getElementById('start-stream').disabled = false;
    document.getElementById('stop-stream').disabled = true;
    document.getElementById('image-controls').style.display = 'none';
    document.getElementById('stream-container').innerHTML = 'Click to start streaming';
    updateButtons();
}

function convertToASCII(imageData) {
    const asciiChars = ['@', '#', 'S', '%', '?', '*', '+', ';', ':', ',', '.'];
    let ascii = '';
    for (let i = 0; i < imageData.height; i += 8) {
        for (let j = 0; j < imageData.width; j += 4) {
            const offset = (i * imageData.width + j) * 4;
            const brightness = (imageData.data[offset] + imageData.data[offset + 1] + imageData.data[offset + 2]) / 3;
            const character = asciiChars[Math.floor(brightness / 25)];
            ascii += character;
        }
        ascii += '\n';
    }
    return ascii;
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-button').forEach(button => button.classList.remove('active'));

    document.getElementById(`${tabName}-tab`).classList.add('active');
    document.querySelector(`.tab-button[data-tab="${tabName}"]`).classList.add('active');

    if (tabName === 'projects') {
        loadProjects();
    } else if (tabName === 'followers') {
        loadFollowers();
    } else if (tabName === 'following') {
        loadFollowing();
    }
}

function loadProjects() {
    fetch(`${apiURL}/users/${username}/projects`)
        .then(response => response.json())
        .then(projects => {
            const projectList = document.getElementById('project-list');
            projectList.innerHTML = '';
            projects.forEach(project => {
                const projectElement = createProjectElement(project);
                projectList.appendChild(projectElement);
            });
        })
        .catch(error => console.error('Error loading projects:', error));
}

function loadFollowers() {
    fetch(`${apiURL}/users/${username}/followers`)
        .then(response => response.json())
        .then(followers => {
            const followersList = document.getElementById('followers-list');
            followersList.innerHTML = '';
            followers.forEach(follower => {
                const followerElement = createFollowElement(follower);
                followersList.appendChild(followerElement);
            });
        })
        .catch(error => console.error('Error loading followers:', error));
}

function loadFollowing() {
    fetch(`${apiURL}/users/${username}/following`)
        .then(response => response.json())
        .then(following => {
            const followingList = document.getElementById('following-list');
            followingList.innerHTML = '';
            following.forEach(follow => {
                const followElement = createFollowElement(follow);
                followingList.appendChild(followElement);
            });
        })
        .catch(error => console.error('Error loading following:', error));
}

function createProjectElement(project) {
    const li = document.createElement('li');
    li.className = 'project-item';
    li.innerHTML = `
        <div class="project-image" style="background-image: url(${project.image})"></div>
        <div class="project-details">
            <h3 class="project-title">${project.title}</h3>
            <p class="project-description">${project.description}</p>
            <div class="project-stats">
                <span>${project.likes} likes</span>
                <span>${project.comments} comments</span>
            </div>
        </div>
    `;
    return li;
}

function createFollowElement(user) {
    const li = document.createElement('li');
    li.className = 'follow-item';
    li.innerHTML = `
        <h3 class="follow-username">${user.username}</h3>
        <p class="follow-bio">${user.bio}</p>
    `;
    return li;
}

function loadMore(type) {
    console.log(`Loading more ${type}...`);
    // Implement pagination logic here
}

function updateImageSettings() {
    const brightness = document.getElementById('brightness').value;
    const contrast = document.getElementById('contrast').value;
    const blur = document.getElementById('blur').value;
    const volume = document.getElementById('master-volume').value;

    document.getElementById('stream-container').style.filter = `
        brightness(${brightness}%)
        contrast(${contrast}%)
        blur(${blur}px)
    `;

    if (audioSource) {
        const gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(volume / 100, audioContext.currentTime);
        audioSource.connect(gainNode);
        gainNode.connect(audioContext.destination);
    }
}

function sendChatMessage() {
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (message) {
        socket.send(JSON.stringify({ type: 'chat', username, message }));
        input.value = '';
    }
}

function addChatMessage(username, message) {
    const chatMessages = document.getElementById('chat-messages');
    const messageElement = document.createElement('div');
    messageElement.textContent = `${username}: ${message}`;
    chatMessages.appendChild(messageElement);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function updateViewerCount() {
    document.getElementById('viewers-count').textContent = `Viewers: ${viewers}`;
}

function updateButtons() {
    const startButton = document.getElementById('start-stream');
    const stopButton = document.getElementById('stop-stream');
    startButton.disabled = isStreaming;
    stopButton.disabled = !isStreaming;
}

// Initial load
switchTab('projects');
</script>
