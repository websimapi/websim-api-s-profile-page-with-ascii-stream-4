<html><head><base href="https://websim.ai/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>API's Profile Page with ASCII Stream</title>

<style>

<script>
const USER_ID = 'e5f7159c-b2c5-4dbe-9bd2-e8ef049458c0';
const ADMIN_USERNAME = 'api';
let projectsEndCursor = null;
let hasNextPageProjects = true;
const room = new WebsimSocket();
const asciiChars = ['@', '#', 'S', '%', '?', '*', '+', ';', ':', ',', '.'];
let isStreaming = false;
let streamers = new Set();
let lastFrames = {};

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const masterGainNode = audioCtx.createGain();
masterGainNode.connect(audioCtx.destination);

const AUDIO_BUFFER_SIZE = 16384;
let audioBuffer = [];

const peerGainNodes = {};

let brightness = 1;
let contrast = 1;
let blur = 0;

let viewersCount = 0;
const messages = [];

const ASCII_RANGE = 126 - 32;
const SAMPLES_PER_CHAR = 4;

async function fetchUserData(userId) {
    const response = await fetch(`/api/v1/users/${userId}`);
    if (!response.ok) throw new Error('Failed to fetch user data');
    const data = await response.json();
    return data.user;
}

async function fetchProjects(userId, after = null, first = 100) {
    const params = new URLSearchParams({ first: first.toString() });
    if (after) params.append('after', after);
    const response = await fetch(`/api/v1/users/${userId}/projects?${params}`);
    if (!response.ok) throw new Error('Failed to fetch projects');
    const data = await response.json();
    projectsEndCursor = data.projects.meta.end_cursor;
    hasNextPageProjects = data.projects.meta.has_next_page;
    return data.projects;
}

async function fetchFollowers(userId) {
    const response = await fetch(`/api/v1/users/${userId}/followers?count=true`);
    if (!response.ok) throw new Error('Failed to fetch followers');
    const data = await response.json();
    return data.followers;
}

async function fetchFollowing(userId) {
    const response = await fetch(`/api/v1/users/${userId}/following?count=true`);
    if (!response.ok) throw new Error('Failed to fetch following');
    const data = await response.json();
    return data.following;
}

function updateUserInfo(user) {
    document.getElementById('avatar').style.backgroundImage = `url(${user.avatar_url || `https://images.websim.ai/v1/user/${user.id}/600`})`;
    document.getElementById('username').textContent = user.username;
    document.title = `${user.username}'s Profile Page`;
}

function updateStats(projectsCount, followersCount, followingCount) {
    document.getElementById('projects-count').textContent = projectsCount + (hasNextPageProjects ? '+' : '');
    document.getElementById('followers-count').textContent = followersCount;
    document.getElementById('following-count').textContent = followingCount;
}

function renderProjects(projects, append = false) {
    const projectList = document.getElementById('project-list');
    const projectHtml = projects.map(project => `
        <li class="project-item">
            <div class="project-image" style="background-image: url('https://images.websim.ai/v1/site/${project.site?.id || 'placeholder'}/600')"></div>
            <div class="project-details">
                <div class="project-title">${project.project.title || 'Untitled Project'}</div>
                <div class="project-description">${project.project.description || 'No description'}</div>
                <div class="project-stats">
                    <span>Views: ${project.project.stats.views}</span>
                    <span>Likes: ${project.project.stats.likes}</span>
                </div>
            </div>
        </li>
    `).join('');
    
    if (append) {
        projectList.innerHTML += projectHtml;
    } else {
        projectList.innerHTML = projectHtml;
    }

    const loadMoreButton = document.getElementById('load-more-projects');
    loadMoreButton.style.display = hasNextPageProjects ? 'block' : 'none';
}

function renderFollowList(users, listId) {
    const list = document.getElementById(listId);
    list.innerHTML = users.map(user => `
        <li class="follow-item">
            <div class="follow-username">${user.follow.user.username}</div>
            <div class="follow-bio">${user.follow.user.description || 'No bio'}</div>
        </li>
    `).join('');
}

async function initializeProfile() {
    try {
        const user = await fetchUserData(USER_ID);
        updateUserInfo(user);
        
        const [projects, followers, following] = await Promise.all([
            fetchProjects(USER_ID),
            fetchFollowers(USER_ID),
            fetchFollowing(USER_ID)
        ]);
        
        updateStats(projects.data.length, followers.meta.count, following.meta.count);
        renderProjects(projects.data);
        renderFollowList(followers.data, 'followers-list');
        renderFollowList(following.data, 'following-list');

        checkAndShowStreamingControls();
    } catch (error) {
        console.error('Error initializing profile:', error);
    }
}

function checkAndShowStreamingControls() {
    const username = room.party.client.username;
    const streamingContent = document.getElementById('streaming-content');
    const streamContainer = document.getElementById('stream-container');
    const controls = document.getElementById('controls');
    const imageControls = document.getElementById('image-controls');

    streamingContent.style.display = 'flex';
    streamContainer.style.display = 'block';

    if (username === 'api') {
        streamContainer.style.cursor = 'pointer';
        controls.style.display = 'flex';
        imageControls.style.display = 'block';
    } else {
        streamContainer.style.cursor = 'default';
        controls.style.display = 'none';
        imageControls.style.display = 'none';
    }
}

function updateUI() {
    const streamContainer = document.getElementById('stream-container');
    
    if (isStreaming) {
        streamContainer.classList.add('streaming');
    } else {
        streamContainer.classList.remove('streaming');
        streamContainer.innerHTML = 'Waiting for stream...';
    }
    
    updateButtons();
    checkAndShowStreamingControls();
}

function updateViewersCount() {
    document.getElementById('viewers-count').textContent = `Viewers: ${viewersCount}`;
}

function addChatMessage(username, message) {
    messages.push({ username, message });
    updateChatMessages();
}

function updateChatMessages() {
    const chatMessages = document.getElementById('chat-messages');
    chatMessages.innerHTML = messages.map(msg => `<p><strong>${msg.username}:</strong> ${msg.message}</p>`).join('');
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

// Update the event listeners
document.getElementById('stream-container').addEventListener('click', () => {
    if (!isStreaming && room.party.client.username === 'api') {
        startStreaming();
    }
});

document.getElementById('start-btn').addEventListener('click', () => {
    if (room.party.client.username === 'api') {
        startStreaming();
    }
});

document.getElementById('stop-btn').addEventListener('click', () => {
    if (room.party.client.username === 'api') {
        stopStreaming();
    }
});

// Only add these event listeners if the user is api
if (room.party.client.username === 'api') {
    document.getElementById('volume').addEventListener('input', function() {
        masterGainNode.gain.setValueAtTime(this.value, audioCtx.currentTime);
    });
    
    document.getElementById('brightness').addEventListener('input', function() {
        brightness = this.value;
    });

    document.getElementById('contrast').addEventListener('input', function() {
        contrast = this.value;
    });

    document.getElementById('blur').addEventListener('input', function() {
        blur = this.value;
    });
}

function encodeAudioToAscii(audioData) {
    const normalizedAudio = audioData.map(sample => (Math.max(-1, Math.min(1, sample)) + 1) / 2);
    let visualizer = '';
    const width = 160;
    const height = 5;
    
    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const startSample = (y * width + x) * SAMPLES_PER_CHAR;
            const samples = normalizedAudio.slice(startSample, startSample + SAMPLES_PER_CHAR);
            
            if (samples.length === 0) {
                visualizer += ' ';
            } else {
                const avgSample = samples.reduce((a, b) => a + b, 0) / samples.length;
                const asciiValue = Math.floor(32 + (avgSample * ASCII_RANGE));
                visualizer += String.fromCharCode(asciiValue);
            }
        }
        visualizer += '\n';
    }
    
    return visualizer.trim();
}

function decodeAsciiToAudio(asciiText) {
    const cleanAscii = asciiText.replace(/\n/g, '');
    const audioData = new Float32Array(cleanAscii.length * SAMPLES_PER_CHAR);
    
    for (let i = 0; i < cleanAscii.length; i++) {
        const asciiValue = cleanAscii.charCodeAt(i);
        const normalizedValue = (asciiValue - 32) / ASCII_RANGE;
        const audioValue = (normalizedValue * 2) - 1;
        
        for (let j = 0; j < SAMPLES_PER_CHAR; j++) {
            audioData[i * SAMPLES_PER_CHAR + j] = audioValue;
        }
    }
    
    return audioData;
}

function smoothAudio(audioData) {
    const smoothingFactor = 0.1;
    let prevSample = 0;
    return audioData.map(sample => {
        const smoothedSample = prevSample + smoothingFactor * (sample - prevSample);
        prevSample = smoothedSample;
        return smoothedSample;
    });
}

function applyFade(audioData, fadeLength = 100) {
    for (let i = 0; i < fadeLength; i++) {
        const fadeFactor = i / fadeLength;
        audioData[i] *= fadeFactor;
        audioData[audioData.length - 1 - i] *= fadeFactor;
    }
    return audioData;
}

function encodeAudio(audioData) {
    const smoothedAudio = smoothAudio(audioData);
    const fadedAudio = applyFade(smoothedAudio);
    const encoded = LZString.compressToBase64(
        Array.from(fadedAudio).map(v => Math.floor(v * 32767)).join(',')
    );
    return encoded;
}

function decodeAudio(encodedAudio) {
    const decoded = LZString.decompressFromBase64(encodedAudio);
    return new Float32Array(decoded.split(',').map(v => parseInt(v) / 32767));
}

function getAsciiFrame(imageData, width, height, audioData) {
    let asciiFrame = '';
    
    for (let y = 0; y < height; y += 2) {
        for (let x = 0; x < width; x++) {
            const index = (y * width + x) * 4;
            const brightness = (imageData[index] + imageData[index + 1] + imageData[index + 2]) / 3;
            const charIndex = Math.floor(brightness / 25);
            asciiFrame += asciiChars[charIndex] || ' ';
        }
        asciiFrame += '\n';
    }

    if (audioData && audioData.length > 0) {
        const audioVisual = encodeAudioToAscii(audioData);
        const encodedAudio = encodeAudio(audioData);
        asciiFrame += '\nAUDIO:\n' + audioVisual + '\nENCODED_AUDIO:' + encodedAudio;
    }
    
    return asciiFrame;
}

async function startStreaming() {
    if (room.party.client.username !== ADMIN_USERNAME) {
        console.error('Only the admin user can start streaming');
        return;
    }

    try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        const video = document.createElement('video');
        video.srcObject = stream;
        await video.play();

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 160;
        canvas.height = 120;

        isStreaming = true;
        streamers.add(room.party.client.id);
        viewersCount++;
        updateViewersCount();
        updateButtons();

        room.send({
            type: 'streamStarted',
            clientId: room.party.client.id,
            username: room.party.client.username
        });

        const audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        const processor = audioContext.createScriptProcessor(4096, 1, 1);

        source.connect(processor);
        processor.connect(audioContext.destination);

        processor.onaudioprocess = (e) => {
            const inputData = e.inputBuffer.getChannelData(0);
            audioBuffer.push(...inputData);
            
            if (audioBuffer.length >= AUDIO_BUFFER_SIZE) {
                sendFrame(video, canvas, ctx);
            }
        };

        function sendFrame(video, canvas, ctx) {
            ctx.filter = `brightness(${brightness}) contrast(${contrast}) blur(${blur}px)`;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.filter = 'none';
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            
            const audioData = audioBuffer.slice(0, AUDIO_BUFFER_SIZE);
            audioBuffer = audioBuffer.slice(AUDIO_BUFFER_SIZE);
            
            const asciiFrame = getAsciiFrame(imageData, canvas.width, canvas.height, audioData);

            room.send({
                type: 'asciiFrame',
                frame: asciiFrame,
                clientId: room.party.client.id,
                username: room.party.client.username
            });

            lastFrames[room.party.client.id] = asciiFrame;
        }

        setInterval(() => {
            if (isStreaming && audioBuffer.length < AUDIO_BUFFER_SIZE) {
                sendFrame(video, canvas, ctx);
            }
        }, 100);

        stream.getVideoTracks()[0].onended = () => {
            stopStreaming();
        };
    } catch (error) {
        console.error('Error accessing display media:', error);
        alert('Failed to start streaming. Please try again.');
    }
}

function stopStreaming() {
    if (room.party.client.username !== ADMIN_USERNAME) {
        console.error('Only the admin user can stop streaming');
        return;
    }

    isStreaming = false;
    streamers.delete(room.party.client.id);
    viewersCount = Math.max(0, viewersCount - 1);
    updateViewersCount();
    updateButtons();
    room.send({ type: 'streamEnded', clientId: room.party.client.id });
}

function updateAsciiContainer(clientId, frame, username) {
    let container = document.getElementById('stream-container');
    container.innerHTML = '';
    container.classList.add('streaming');
    
    const [videoData, audioData] = frame.split('\nAUDIO:\n');
    const [audioVisual, encodedAudio] = audioData ? audioData.split('\nENCODED_AUDIO:') : ['', ''];
    
    container.innerHTML = `${username}:<br>${videoData}`;
    
    if (audioVisual) {
        const audioVisualizer = document.createElement('div');
        audioVisualizer.className = 'audio-visualizer';
        audioVisualizer.innerHTML = audioVisual;
        container.appendChild(audioVisualizer);
        
        playAudio(encodedAudio, clientId);
    }
}

// Update the room.onmessage function
room.onmessage = (event) => {
    const data = event.data;
    if (data.type === 'asciiFrame') {
        updateAsciiContainer(data.clientId, data.frame, data.username);
        lastFrames[data.clientId] = data.frame;
    } else if (data.type === 'streamEnded') {
        streamers.delete(data.clientId);
        delete lastFrames[data.clientId];
        viewersCount = Math.max(0, viewersCount - 1);
        updateViewersCount();
        updateUI();
    } else if (data.type === 'streamStarted') {
        streamers.add(data.clientId);
        viewersCount++;
        updateViewersCount();
        updateUI();
    } else if (data.type === 'requestLastFrame') {
        if (isStreaming) {
            room.send({
                type: 'asciiFrame',
                frame: lastFrames[room.party.client.id],
                clientId: room.party.client.id,
                username: room.party.client.username
            });
        }
    } else if (data.type === 'chatMessage') {
        addChatMessage(data.username, data.message);
    }
};

// Add event listener for chat input
document.getElementById('chat-send').addEventListener('click', () => {
    const chatInput = document.getElementById('chat-input');
    const message = chatInput.value.trim();
    if (message) {
        room.send({
            type: 'chatMessage',
            username: room.party.client.username,
            message: message
        });
        chatInput.value = '';
    }
});

document.getElementById('chat-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('chat-send').click();
    }
});

document.querySelectorAll('.tab-button').forEach(button => {
    button.addEventListener('click', () => {
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        button.classList.add('active');
        document.getElementById(button.dataset.tab).classList.add('active');
    });
});

document.getElementById('load-more-projects').addEventListener('click', async () => {
    try {
        const projects = await fetchProjects(USER_ID, projectsEndCursor);
        renderProjects(projects.data, true);
    } catch (error) {
        console.error('Error loading more projects:', error);
    }
});

room.store.update({
    id: 'connectionState',
    dependencies: { clientId: room.party.client.id },
    updateFunction: (state) => {
        if (!state) state = {};
        state[clientId] = { connected: true };
        return state;
    }
});

window.addEventListener('beforeunload', () => {
    if (isStreaming) {
        stopStreaming();
    }
    room.store.update({
        id: 'connectionState',
        dependencies: { clientId: room.party.client.id },
        updateFunction: (state) => {
            if (state && state[clientId]) {
                delete state[clientId];
            }
            return state;
        }
    });
});

initializeProfile();
</script>
